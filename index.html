<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1515" />
    <script>
      try {
        if (localStorage.getItem('ana-fit-planner:ui-theme:v1') === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f5f7f6');
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="Sua rotina, seu ritmo. Organize treinos, registre cada série e acompanhe a evolução com o Ana Fit Planner."
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>Ana Fit Planner</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
